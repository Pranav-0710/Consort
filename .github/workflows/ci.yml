# Checks every PR and every push to main.
# The job names below are required status checks on main. Renaming one silently
# disables that protection, so change them only together with the ruleset
# (docs/CONTRIBUTING.md, "Checks on every PR").
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-linux:
    name: verify-linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Hooks, paths and git worktree behave differently on the team's Windows machines,
  # so the workspaces that touch them are also checked on Windows.
  verify-windows:
    name: verify-windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck Windows-sensitive workspaces
        run: npx tsc -b packages/adapter-claude tools/check-runner spike/harness
      - name: Test Windows-sensitive workspaces
        run: npm test --workspace @consort/adapter-claude --workspace @consort/check-runner --workspace @consort/spike-harness
      - name: Boundary tests (path handling on Windows)
        run: npx vitest run

  # Fails the build on committed credentials. Config and allowlist policy: .gitleaks.toml.
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Free for repositories owned by a personal account. If the repo moves to an
      # organization, add a GITLEAKS_LICENSE secret or switch to the gitleaks CLI.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: false

  doc-links:
    name: doc-links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node .github/scripts/check-links.mjs
